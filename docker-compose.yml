

services:
  backend:
    build:
      context: ./fawatir_backend
      dockerfile: Dockerfile
    container_name: fawatir_backend
    ports:
      - "8000:8000"
    volumes:
      - ./fawatir_backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-key
      - ALLOWED_HOSTS=*
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fawatir_frontend
    ports:
      - "3000:3000"
    # env_file:
    #   - ../.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
